name: Upstream smoke

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: ./bootstrap default --yes --progress plain
      - if: always()
        run: ./dev status --format json
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-smoke-${{ matrix.os }}
          path: .state/logs/*.log
          if-no-files-found: ignore
