name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --project .workspace --locked --group dev
      - run: uv run --project .workspace --group dev pytest .workspace/tests
      - run: sh -n bootstrap dev
